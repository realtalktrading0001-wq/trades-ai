# Render.com Blueprint — deploys TRADES AI as a single web service
# (Express serves both the API and the built client over one HTTPS origin).
#
# Deploy: push this repo to GitHub → Render Dashboard → New + → Blueprint →
# pick the repo. Then set the secret env vars (BOT_TOKEN, BOT_USERNAME,
# POCKETOPTION_REF_URL) in the service's Environment tab.
services:
  - type: web
    name: trades-ai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: BOT_TOKEN
        sync: false            # paste your @BotFather token in the dashboard
      - key: BOT_USERNAME
        value: tradesaipocketbot   # your bot @username, no @ (public, not a secret)
      - key: POCKETOPTION_REF_URL
        sync: false            # your real affiliate link
      - key: SUPPORT_HANDLE
        value: Tradesaisupport
      - key: WEEKLY_PRIZE_POOL
        value: "400"
      # PocketOption affiliate API (real ID verification)
      - key: POCKETOPTION_API_TOKEN
        sync: false            # paste your affiliate API token in the dashboard (secret)
      - key: POCKETOPTION_PARTNER_ID
        value: "752344"
      - key: POCKETOPTION_API_BASE
        value: https://pocketpartners.com/api/user-info
      - key: MIN_DEPOSIT_USD
        value: "15"
      - key: VERIFY_DELAY_SECONDS
        value: "6"            # fallback only (used if POCKETOPTION_API_TOKEN is blank)
